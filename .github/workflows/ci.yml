name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check
        type: string
        required: true
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run --locked pytest
      - name: Test migration, spending controls and credential storage on scratch Postgres
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser "$USER"
          sudo -u postgres createdb --owner="$USER" jumpseat_test
          TEST_DATABASE_URL=postgresql:///jumpseat_test uv run --locked pytest -q tests/test_security_boundaries.py tests/test_credentials.py
      - run: uv run --locked ruff check
      - run: bash scripts/check-dead-code.sh

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci
      - run: npx wrangler types --strict-vars=false --check
      - run: npm run typecheck
      - run: npm test

  image:
    # Starts the Playwright driver inside the real container image. Unit tests mock the
    # browser, so a driver that cannot run in python:3.12-slim (v0.5.0: playwright 1.65.0
    # needed libatomic.so.1) only shows up here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: docker build --platform linux/amd64 -t ifd-ci .
      - run: >-
          docker run --rm --platform linux/amd64 ifd-ci /app/.venv/bin/python -c
          'from playwright.sync_api import sync_playwright;
          p = sync_playwright().start(); p.stop(); print("playwright driver ok")'
      - name: Check service account filesystem permissions
        run: |
          docker run --rm --platform linux/amd64 ifd-ci sh -ec '
            test "$(id -u)" = 10001
            test ! -w /app && test ! -w /app/src && test ! -w /app/.venv
            test -z "$(find /app/src /app/.venv -writable -print -quit)"
            touch /app/data/permission-check
          '
      - if: inputs.ref != ''
        run: docker save ifd-ci | gzip -1 > "$RUNNER_TEMP/ci-image.tar.gz"
      - if: inputs.ref != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-image-${{ github.sha }}
          path: ${{ runner.temp }}/ci-image.tar.gz
          retention-days: 1
          compression-level: 0
