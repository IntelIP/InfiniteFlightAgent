name: Emergency stop
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type STOP to disable new paid operations
        type: string
        required: true
permissions: {}
jobs:
  stop:
    if: ${{ inputs.confirm == 'STOP' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Latch paid operations off
        env:
          STOP_PGSERVICE: ${{ secrets.STOP_PGSERVICE }}
          PGCONNECT_TIMEOUT: 5
          DURABLE_ONLY: ${{ vars.IFD_DURABLE_STOP_READY }}
        run: |
          if [[ -z "$STOP_PGSERVICE" && "$DURABLE_ONLY" != "true" ]]; then
            echo "Database stop credential is not configured. Check the legacy stop job." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -n "$STOP_PGSERVICE"
          umask 077
          export PGSERVICEFILE="$RUNNER_TEMP/stop.pg_service.conf" PGSERVICE=jumpseat_stop
          trap 'rm -f "$PGSERVICEFILE"' EXIT
          printf '%s\n' "$STOP_PGSERVICE" > "$PGSERVICEFILE"
          unset STOP_PGSERVICE
          result="$(psql -XAt -v ON_ERROR_STOP=1 -c 'SELECT public.stop_jumpseat()')"
          if [[ "$result" != t ]]; then
            echo "Database did not confirm the stop" >&2
            exit 1
          fi
          echo "Database stop confirmed for versions using the durable policy. Already-admitted work may finish." >> "$GITHUB_STEP_SUMMARY"

  legacy-stop:
    # Keep the current production version stoppable between merge and cutover.
    if: ${{ inputs.confirm == 'STOP' && github.ref == 'refs/heads/main' && vars.IFD_DURABLE_STOP_READY != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Disable the legacy Worker switch
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf 'false' | ./node_modules/.bin/wrangler secret put IFD_PAID_OPERATIONS_ENABLED
          echo "Legacy stop applied. Keep paid operations disabled in Doppler before another legacy deployment." >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: echo "Legacy stop unconfirmed. Block the Access route or revoke provider keys before promoting another candidate." >> "$GITHUB_STEP_SUMMARY"
