[project]
name = "infinite-flight-dispatcher"
version = "0.5.1"
description = "AI dispatcher for Infinite Flight: real flights, SimBrief plans, and takeoff N1 estimates over MCP"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "mcp==1.27.0",
    "httpx==0.28.1",
    "pydantic>=2.11,<3",
    "deepagents>=0.7.32",
    "langsmith==0.14.17",
    "langchain-openai>=1.7.3",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pyjwt[crypto]>=2.15.1",
    "browserbase>=1.23.0",
    "playwright==1.64.1",  # 1.65.0 driver needs libatomic.so.1, absent from python:3.12-slim
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.2",
    "langgraph-checkpoint-postgres>=3.2.0",
    "boto3>=1.43.123",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.14.14", "vulture==2.16"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ifdispatcher"]

[project.urls]
Homepage = "https://github.com/IntelIP/InfiniteFlightAgent"
Issues = "https://github.com/IntelIP/InfiniteFlightAgent/issues"

[project.scripts]
ifdispatcher = "ifdispatcher.server:main"
ifd-login = "ifdispatcher.siwc:main"
ifd-credentials = "ifdispatcher.siwc:credentials_main"
ifd-serve = "ifdispatcher.remote:main"
ifd-chat = "ifdispatcher.agent:main"
ifd-simbrief = "ifdispatcher.simbrief_browser:main"
